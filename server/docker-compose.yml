version: '3.8'

services:
  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SESSIONS_SERVICE_URL=http://sessions-service:3002
      - EVENTS_SERVICE_URL=http://events-service:3003
      - BLOG_SERVICE_URL=http://blog-service:3004
      - COMMUNITY_SERVICE_URL=http://community-service:3005
    depends_on:
      - auth-service
      - sessions-service
      - events-service
      - blog-service
      - community-service
    networks:
      - learning-platform-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    networks:
      - learning-platform-network

  # Sessions Service
  sessions-service:
    build:
      context: ./services/sessions-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
    networks:
      - learning-platform-network

  # Events Service
  events-service:
    build:
      context: ./services/events-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
    networks:
      - learning-platform-network

  # Blog Service
  blog-service:
    build:
      context: ./services/blog-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
    networks:
      - learning-platform-network

  # Community Service
  community-service:
    build:
      context: ./services/community-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
    networks:
      - learning-platform-network

networks:
  learning-platform-network:
    driver: bridge

